name: Build & Push Images

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  id-token: write   # required for OIDC
  contents: read

env:
  DOCKER_HUB_USERNAME: ${{ secrets.DOCKER_HUB_USERNAME }}

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: userservice
            dockerfile: services/UserService/Dockerfile
            context: services/UserService
          - service: mediaservice
            dockerfile: services/MediaService/Dockerfile
            context: services/MediaService
          - service: realtimehub
            dockerfile: services/RealTimeHub/Dockerfile
            context: services/RealTimeHub
          - service: socialgraphservice
            dockerfile: services/SocialGraphService/Dockerfile
            context: .
          - service: socialcontentservice
            dockerfile: services/SocialContentService/Dockerfile
            context: .
          - service: feedservice
            dockerfile: services/FeedService/Dockerfile
            context: .
          - service: moderationservice
            dockerfile: services/ModerationService/Dockerfile
            context: .
          - service: communicationservice
            dockerfile: services/CommunicationService/Dockerfile
            context: services/CommunicationService
          - service: presenceservice
            dockerfile: services/PresenceService/Dockerfile
            context: services/PresenceService
          - service: signalingservice
            dockerfile: services/SignalingService/Dockerfile
            context: services/SignalingService
          - service: inventoryservice
            dockerfile: services/InventoryService/Dockerfile
            context: services/InventoryService
          - service: analyticsservice
            dockerfile: services/AnalyticsService/Dockerfile
            context: services/AnalyticsService
          - service: adservice
            dockerfile: services/AdService/Dockerfile
            context: services/AdService

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_TOKEN }}

      - name: Build & push ${{ matrix.service }}
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: ${{ github.event_name == 'push' }}
          tags: |
            ${{ env.DOCKER_HUB_USERNAME }}/sc-${{ matrix.service }}:latest
            ${{ env.DOCKER_HUB_USERNAME }}/sc-${{ matrix.service }}:${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,scope=${{ matrix.service }},mode=max

  deploy-spa:
    name: Deploy React SPA
    runs-on: ubuntu-latest
    # Runs on push (production) AND pull_request (SWA preview with MSW mocks)
    # Does NOT depend on the backend build matrix — SPA is independent
    steps:
      - uses: actions/checkout@v4

      - name: Run frontend tests
        working-directory: socialcommerce
        run: npm ci && npm test

      - name: Build Vite app
        working-directory: socialcommerce
        env:
          # PRs deploy a mock-backed preview; main uses real ACA backend (.env.production)
          VITE_MOCK_API: ${{ github.event_name == 'pull_request' && 'true' || 'false' }}
        run: npm run build

      - name: Deploy to Azure Static Web Apps
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: upload
          app_location: socialcommerce/dist
          output_location: ""
          skip_app_build: true   # built in previous step

  deploy-aca:
    name: Deploy to Azure Container Apps
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name == 'push'
    environment: production

    steps:
      - uses: actions/checkout@v4

      - name: Azure login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_TOKEN }}

      - name: Deploy all services
        shell: pwsh
        run: >
          ./scripts/deploy-aca.ps1
          -ImageTag "${{ github.sha }}"
          -DockerUser "${{ secrets.DOCKER_HUB_USERNAME }}"
          -DockerHubToken "${{ secrets.DOCKER_HUB_TOKEN }}"
